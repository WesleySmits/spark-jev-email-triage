name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm via Corepack
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Storybook tests
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test-storybook
      - run: pnpm fallow

      - name: Fallow changed-code audit
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec fallow audit --base "origin/$BASE_REF"

      - run: pnpm build
      - run: pnpm build-storybook

      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Check for uncommitted generated changes
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  # The one check a branch requires before a merge. Adding a job here means
  # adding it to `needs`, which `src/release/ci-workflow.test.ts` enforces,
  # so a new job cannot quietly stop being required.
  required-checks:
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success
          done
